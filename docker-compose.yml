services:

  database:
    image: postgres:15-alpine
    container_name: freshbasket-database
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: Freshbasket_BD
    ports:
      - "5435:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/respaldo_freshbasket:/docker-entrypoint-initdb.d/init.sql
    networks:
      - freshbasket-network


  backend:
    build: ./backend
    container_name: freshbasket-backend
    restart: always
    ports:
      - "0.0.0.0:8080:8080"
    environment:
        SPRING_DATASOURCE_URL: "jdbc:postgresql://database:5432/Freshbasket_BD"
        SPRING_DATASOURCE_USERNAME: "postgres"
        SPRING_DATASOURCE_PASSWORD: "123456"
        SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
    volumes:
      - ./backend-uploads:/app/uploads
    depends_on:
      - database
    networks:
      - freshbasket-network

  frontend:
    build: ./frontend
    container_name: freshbasket-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - freshbasket-network

volumes:
  pg_data:

networks:
  freshbasket-network:
    driver: bridge